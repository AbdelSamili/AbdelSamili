<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Abdelkhaleq Samili — Software Engineer, QA, Testing &amp; AI</title>
  <desc id="desc">Banner with name and title on the left and a terminal-style test report on the right listing build, test, LLM evaluation and ISTQB certification, all passing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1F3D"/>
      <stop offset="1" stop-color="#0E2F5A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
      .sans { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  <rect x="0" y="0" width="6" height="320" fill="#3FB27F" clip-path="url(#round)"/>

  <!-- Left: identity -->
  <text x="64" y="92" class="mono" font-size="16" fill="#7FA7D9">// software quality engineering</text>
  <text x="64" y="150" class="sans" font-size="52" font-weight="700" fill="#FFFFFF">Abdelkhaleq Samili</text>
  <text x="64" y="194" class="sans" font-size="24" fill="#9CC3F0">Software Engineer · QA, Testing &amp; AI</text>
  <rect x="64" y="218" width="64" height="3" rx="1.5" fill="#3FB27F"/>
  <text x="64" y="256" class="mono" font-size="15" fill="#C9D6E8">Java · Spring Boot · Selenium · Playwright · LLM evaluation</text>

  <!-- Right: terminal test report -->
  <g transform="translate(700,46)">
    <rect width="452" height="228" rx="12" fill="#061427" stroke="#1F4A80" stroke-width="1.5"/>
    <rect width="452" height="34" rx="12" fill="#0C2647"/>
    <rect y="22" width="452" height="12" fill="#0C2647"/>
    <circle cx="20" cy="17" r="5.5" fill="#E5534B"/>
    <circle cx="38" cy="17" r="5.5" fill="#E2B340"/>
    <circle cx="56" cy="17" r="5.5" fill="#3FB27F"/>
    <text x="226" y="22" text-anchor="middle" class="mono" font-size="12" fill="#7FA7D9">profile.test</text>

    <g class="mono" font-size="14">
      <text x="22" y="66" fill="#7FA7D9">$ <tspan fill="#E6EDF3">run --suite=abdelkhaleq</tspan></text>
      <text x="22" y="98" fill="#3FB27F">✓ <tspan x="42" fill="#9CC3F0">builds</tspan><tspan x="148" fill="#E6EDF3">Java · Spring Boot · React</tspan></text>
      <text x="22" y="124" fill="#3FB27F">✓ <tspan x="42" fill="#9CC3F0">tests</tspan><tspan x="148" fill="#E6EDF3">JUnit 5 · Selenium · Playwright</tspan></text>
      <text x="22" y="150" fill="#3FB27F">✓ <tspan x="42" fill="#9CC3F0">evaluates</tspan><tspan x="148" fill="#E6EDF3">LLM &amp; RAG apps</tspan></text>
      <text x="22" y="176" fill="#3FB27F">✓ <tspan x="42" fill="#9CC3F0">certified</tspan><tspan x="148" fill="#E6EDF3">ISTQB CTFL</tspan></text>
      <text x="22" y="208" fill="#E6EDF3">Tests: <tspan fill="#3FB27F" font-weight="700">4 passed</tspan>, 0 failed</text>
    </g>
  </g>
</svg>
